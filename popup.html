<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        width: 420px;
        margin: 0;
        padding: 6px;
        font-family: monospace;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
      }

      #display {
        flex: 0 0 80px;
        white-space: nowrap;
        padding: 4px 6px;
        border-radius: 3px;
        background: black;
        color: white;
        text-align: center;
        font-size: 11px;
      }

      #slider {
        flex: 1;
        min-width: 0;
        margin: 0;
      }

      .buttons {
        display: flex;
        gap: 4px;
        flex-wrap: nowrap;
      }

      button {
        flex: 1;
        min-width: 0;
        padding: 3px 2px;
        font-size: 10px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="header">
      <div id="display">Speed: 1</div>

      <input
        id="slider"
        type="range"
        min="0.25"
        max="10"
        value="1"
        step="0.25"
      />
    </div>

    <div class="buttons">
      <button id="1">1</button>
      <button id="1.5">1.5</button>
      <button id="2">2</button>
      <button id="2.25">2.25</button>
      <button id="2.5">2.5</button>
      <button id="2.75">2.75</button>
      <button id="3">3</button>
      <button id="3.25">3.25</button>
      <button id="3.5">3.5</button>
      <button id="3.75">3.75</button>
      <button id="4">4</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
